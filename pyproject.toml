[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-connectivity"
version = "0.1.0"
description = "Dynamic functional connectivity analysis toolkit for Alzheimer's disease rs-fMRI research (synthetic + real-data modes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4",
  "networkx>=3.2", "matplotlib>=3.8", "seaborn>=0.13", "statsmodels>=0.14", "PyYAML>=6.0",
]

[project.optional-dependencies]
imaging = ["nibabel>=5.2", "nilearn>=0.10"]
dev = ["pytest>=8.0"]
xgboost = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
